name: Build and test
on:
  push: null
env:
  PY_IGNORE_IMPORTMISMATCH: 1
jobs:
  build-wheel:
    runs-on: ubuntu-latest
    outputs:
      wheel-path: ${{ steps.get-darker-version.outputs.wheel-path }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: 3.x
    - name: Install uv
      uses: astral-sh/setup-uv@v4
      with:
        enable-cache: true
        cache-dependency-glob: '**/setup.cfg

          **/pyproject.toml

          '
    - name: Build wheel distribution
      run: 'uv build --wheel

        '
    - name: Upload wheel for other jobs
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/
        if-no-files-found: error
    - name: Find out Darker version and output it for test jobs
      id: get-darker-version
      shell: python
      run: "from os import environ\nfrom pathlib import Path\nfrom runpy import run_path\nversion = run_path(\"\
        src/darker/version.py\")[\"__version__\"]\nPath(environ[\"GITHUB_OUTPUT\"]).open(\"a\").write(\n\
        \    f\"wheel-path=dist/darker-{version}-py3-none-any.whl\\n\"\n)\n"
  test-nixos:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
        - ubuntu-latest
        - macos-latest
    needs:
    - build-wheel
    steps:
    - uses: actions/checkout@v4
    - uses: cachix/install-nix-action@v22
      with:
        nix_path: nixpkgs=channel:nixos-unstable
    - name: Download wheel uploaded by the build-wheel job
      uses: actions/download-artifact@v4
    - name: Run tests in nix-shell
      run: "nix-shell \\\n  --pure \\\n  --run '\n    python -m venv venv\n    source venv/bin/activate\n\
        \    cert_file=/nix/var/nix/profiles/default/etc/ssl/certs/ca-bundle.crt\n    export NIX_SSL_CERT_FILE=$cert_file\n\
        \    pip install \"${{needs.build-wheel.outputs.wheel-path}}[dev]\"\n    # Run tests in installed\
        \ package to avoid plugin import issue:\n    pytest $(python -c \"\nimport os, darker\nprint(os.path.dirname(darker.__file__))\n\
        \    \")\n  ' \\\n  ./default.nix\n"
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
        - ubuntu-latest
        - windows-latest
        - macos-latest
        python-version:
        - '3.9'
        - '3.10'
        - '3.11'
        - '3.12'
        - 3.13-dev
        constraints:
        - ''
        post_install:
        - ''
        exclude:
        - os: windows-latest
          python-version: 3.13-dev
        - os: macos-latest
          python-version: 3.13-dev
        include:
        - os: ubuntu-latest
          python-version: '3.9'
          post_install: uv sync --resolution lowest-direct
        - os: ubuntu-latest
          python-version: '3.12'
          post_install: uv sync --upgrade
    needs:
    - build-wheel
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Install uv
      uses: astral-sh/setup-uv@v3
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Download wheel uploaded by the build-wheel job
      uses: actions/download-artifact@v4
    - name: Install Darker and its dependencies from the wheel built earlier
      run: pip install "${{needs.build-wheel.outputs.wheel-path}}[dev]" ${{ matrix.upgrade }} ${{ matrix.constraints
        }}
    - name: Downgrade target-version when running oldest supported Black
      if: matrix.constraints == '--constraint constraints-oldest.txt'
      run: 'sed -i ''s/, "py311", "py312"//'' pyproject.toml

        '
    - name: Upgrade Black, Flynt and Isort from GitHub if future constraints are used
      if: matrix.post_install
      run: ${{ matrix.post_install }}
    - run: pytest
  build-sdist-validate-dists:
    runs-on: ubuntu-latest
    needs:
    - build-wheel
    steps:
    - uses: actions/checkout@v4
    - name: Install uv
      uses: astral-sh/setup-uv@v3
    - uses: actions/setup-python@v5
    - name: Download wheel uploaded by the build-wheel job
      uses: actions/download-artifact@v4
    - name: Build source distribution
      run: uv build --sdist
    - name: Validate distributions
      run: uvx twine check dist/*
